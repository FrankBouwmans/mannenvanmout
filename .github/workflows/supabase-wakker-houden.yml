# Houdt het gratis Supabase-project wakker (pauzeert anders na ±7 dagen zonder gebruik).
# Draait elke maandag en donderdag om 06:17 (UTC) en vraagt de publieke bierlijst op.
# Handmatig starten kan via GitHub → Actions → "Supabase wakker houden" → Run workflow.
name: Supabase wakker houden

on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config.js
          sparse-checkout-cone-mode: false
      - name: Publieke bierlijst opvragen
        run: |
          set -euo pipefail
          URL=$(grep -oE 'supabaseUrl: *"[^"]+"' config.js | sed -E 's/.*"([^"]+)"/\1/')
          KEY=$(grep -oE 'supabaseAnonKey: *"[^"]+"' config.js | sed -E 's/.*"([^"]+)"/\1/')
          for i in 1 2 3; do
            CODE=$(curl -s -o antwoord.json -w '%{http_code}' \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              "$URL/rest/v1/public_beers?select=name&limit=1") || CODE=000
            echo "Poging $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "Supabase is wakker:"; cat antwoord.json; exit 0; fi
            sleep 20
          done
          echo "::error::Supabase reageert niet (HTTP $CODE). Staat het project op pauze? Ga naar supabase.com en klik op Restore."
          exit 1
